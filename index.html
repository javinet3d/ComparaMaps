        }

        (function setupOverlayWindowDragAndResize() {
            const win = document.getElementById('overlayMiniWindow');
            const dragHandle = document.getElementById('overlayDragHandle');
            const resizeHandle = document.getElementById('overlayResizeHandle');

            let isDragging = false;
            let isResizing = false;
            let startX = 0, startY = 0;
            let startLeft = 0, startTop = 0;
            let startW = 0, startH = 0;

            function getClientXY(e) {
                if (e.touches && e.touches.length > 0) {
                    return { x: e.touches[0].clientX, y: e.touches[0].clientY };
                }
                return { x: e.clientX, y: e.clientY };
            }

            function onDragStart(e) {
                if (e.target.closest('button')) return;
                isDragging = true;
                win.dataset.moved = 'true';
                const pt = getClientXY(e);
                const rect = win.getBoundingClientRect();
                startX = pt.x;
                startY = pt.y;
                startLeft = rect.left;
                startTop = rect.top;
                win.style.bottom = 'auto';
                win.style.right = 'auto';
                win.style.left = `${startLeft}px`;
                win.style.top = `${startTop}px`;
                e.preventDefault();
            }

            function onResizeStart(e) {
                isResizing = true;
                win.dataset.moved = 'true';
                const pt = getClientXY(e);
                const rect = win.getBoundingClientRect();
                startX = pt.x;
                startY = pt.y;
                startW = rect.width;
                startH = rect.height;
                win.style.bottom = 'auto';
                win.style.right = 'auto';
                win.style.left = `${rect.left}px`;
                win.style.top = `${rect.top}px`;
                e.preventDefault();
                e.stopPropagation();
            }

            function onPointerMove(e) {
                if (!isDragging && !isResizing) return;
                const pt = getClientXY(e);
                if (isDragging) {
                    const rect = win.getBoundingClientRect();
                    const newLeft = Math.max(4, Math.min(window.innerWidth - rect.width - 4, startLeft + (pt.x - startX)));
                    const newTop = Math.max(50, Math.min(window.innerHeight - rect.height - 4, startTop + (pt.y - startY)));
                    win.style.left = `${newLeft}px`;
                    win.style.top = `${newTop}px`;
                } else if (isResizing) {
                    const rect = win.getBoundingClientRect();
                    const maxW = window.innerWidth - rect.left - 6;
                    const maxH = window.innerHeight - rect.top - 6;
                    const newW = Math.max(250, Math.min(maxW, startW + (pt.x - startX)));
                    const newH = Math.max(175, Math.min(maxH, startH + (pt.y - startY)));
                    win.style.width = `${newW}px`;
                    win.style.height = `${newH}px`;
                    overlayMap1.invalidateSize();
                    overlayMap2.invalidateSize();
                    syncOverlayMaps();
                }
            }

            function onPointerEnd() {
                if (isDragging || isResizing) {
                    isDragging = false;
                    isResizing = false;
                    overlayMap1.invalidateSize();
                    overlayMap2.invalidateSize();
                    syncOverlayMaps();
                }
            }

            dragHandle.addEventListener('mousedown', onDragStart);
            dragHandle.addEventListener('touchstart', onDragStart, { passive: false });

            resizeHandle.addEventListener('mousedown', onResizeStart);
            resizeHandle.addEventListener('touchstart', onResizeStart, { passive: false });

            window.addEventListener('mousemove', onPointerMove);
            window.addEventListener('touchmove', onPointerMove, { passive: false });
            window.addEventListener('mouseup', onPointerEnd);
            window.addEventListener('touchend', onPointerEnd);
        })();

        document.getElementById('btnToggleOverlayWindow').addEventListener('click', () => toggleOverlayWindow());
        document.getElementById('btnCloseOverlayWindow').addEventListener('click', () => toggleOverlayWindow(false));

        document.getElementById('btnSwapOverlayOrder').addEventListener('click', () => {
            state.overlaySwapped = !state.overlaySwapped;
            updateOverlayLayerStackAndOpacity();
        });

        const overlayOpacitySlider = document.getElementById('overlayOpacitySlider');
        const overlayOpacityValue = document.getElementById('overlayOpacityValue');

        overlayOpacitySlider.addEventListener('input', (e) => {
            state.overlayOpacity = parseInt(e.target.value, 10);
            overlayOpacityValue.textContent = `${state.overlayOpacity}%`;
            updateOverlayLayerStackAndOpacity();
        });

        document.querySelectorAll('.preset-opacity-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                state.overlayOpacity = parseInt(btn.dataset.opacity, 10);
                overlayOpacitySlider.value = state.overlayOpacity;
                overlayOpacityValue.textContent = `${state.overlayOpacity}%`;
                updateOverlayLayerStackAndOpacity();
            });
        });

        let searchMarker1 = null;
        let searchMarker2 = null;

        updateScaleBadges();

        /**************************************************************************
         * CAMBIO DE MODO DE ESCALA / PROYECCIÓN
         **************************************************************************/
        function setMapProjection(mapNum, projKey) {
            const targetMap = mapNum === 1 ? map1 : map2;
            if (mapNum === 1) state.map1Proj = projKey;
            else state.map2Proj = projKey;

            const selectEl = document.getElementById(`projSelect${mapNum}`);
            if (selectEl && selectEl.value !== projKey) selectEl.value = projKey;

            state.isProgrammaticMove = true;
            const c = targetMap.getCenter();
            const newEffectiveZoom = computeEffectiveMapZoom(state.baseZoom, projKey, c.lat);
            targetMap.setView(c, newEffectiveZoom, { animate: true });
            applyGallPetersAspectTransform(mapNum);
            updateScaleBadges();

            setTimeout(() => {
                state.isProgrammaticMove = false;
                syncOverlayMaps();
            }, 250);
        }

        document.getElementById('projSelect1').addEventListener('change', (e) => setMapProjection(1, e.target.value));
        document.getElementById('projSelect2').addEventListener('change', (e) => setMapProjection(2, e.target.value));

        /**************************************************************************
         * SISTEMA DE ROTACIÓN DE VISTA Y ORIENTACIÓN DEL NORTE
         **************************************************************************/
        function normalizeAngle(deg) {
            return ((Math.round(deg) % 360) + 360) % 360;
        }

        function getCardinalDirection(deg) {
            const dirs = ['N', 'NE', 'E', 'SE', 'S', 'SO', 'O', 'NO'];
            return dirs[Math.round(deg / 45) % 8];
        }

        function applyMapBearing(mapNum, angleDeg, syncOther = true) {
            const norm = normalizeAngle(angleDeg);
            const targetMap = mapNum === 1 ? map1 : map2;
            const otherMap = mapNum === 1 ? map2 : map1;
            const otherNum = mapNum === 1 ? 2 : 1;

            if (mapNum === 1) state.map1Bearing = norm;
            else state.map2Bearing = norm;

            if (typeof targetMap.setBearing === 'function') targetMap.setBearing(norm);
            updateCompassUI(mapNum, norm);

            if (syncOther && state.syncBearing) {
                if (otherNum === 1) state.map1Bearing = norm;
                else state.map2Bearing = norm;
                if (typeof otherMap.setBearing === 'function') otherMap.setBearing(norm);
                updateCompassUI(otherNum, norm);
            }
            syncOverlayMaps();
        }

        function updateCompassUI(mapNum, angleDeg) {
            const norm = normalizeAngle(angleDeg);
            const needle = document.getElementById(`compassNeedle${mapNum}`);
            const label = document.getElementById(`bearingValue${mapNum}`);
            const slider = document.getElementById(`bearingSlider${mapNum}`);

            if (needle) needle.style.transform = `rotate(${norm}deg)`;
            if (label) label.textContent = `${norm}° ${getCardinalDirection(norm)}`;
            if (slider && document.activeElement !== slider) slider.value = norm;
        }

        function handleMapRotateEvent(mapNum) {
            const targetMap = mapNum === 1 ? map1 : map2;
            const otherMap = mapNum === 1 ? map2 : map1;
            const otherNum = mapNum === 1 ? 2 : 1;

            if (typeof targetMap.getBearing === 'function') {
                const b = normalizeAngle(targetMap.getBearing());
                if (mapNum === 1) state.map1Bearing = b;
                else state.map2Bearing = b;
                updateCompassUI(mapNum, b);

                if (state.syncBearing && !state.isProgrammaticMove) {
                    state.isProgrammaticMove = true;
                    if (otherNum === 1) state.map1Bearing = b;
                    else state.map2Bearing = b;
                    if (typeof otherMap.setBearing === 'function') otherMap.setBearing(b);
                    updateCompassUI(otherNum, b);
                    state.isProgrammaticMove = false;
                }
            }
        }

        map1.on('rotate', () => handleMapRotateEvent(1));
        map2.on('rotate', () => handleMapRotateEvent(2));

        function enableRightClickDragRotation(mapInstance, mapNum) {
            const container = mapInstance.getContainer();
            let isRotatingDrag = false;
            let startX = 0;
            let startBearing = 0;

            container.addEventListener('contextmenu', (e) => e.preventDefault());

            container.addEventListener('mousedown', (e) => {
                if (e.button === 2 || (e.button === 0 && e.ctrlKey)) {
                    isRotatingDrag = true;
                    startX = e.clientX;
                    startBearing = mapNum === 1 ? state.map1Bearing : state.map2Bearing;
                    mapInstance.dragging.disable();
                    e.preventDefault();
                }
            });

            window.addEventListener('mousemove', (e) => {
                if (!isRotatingDrag) return;
                const deltaX = e.clientX - startX;
                applyMapBearing(mapNum, startBearing + deltaX * 0.65, true);
            });

            window.addEventListener('mouseup', () => {
                if (isRotatingDrag) {
                    isRotatingDrag = false;
                    mapInstance.dragging.enable();
                }
            });
        }

        enableRightClickDragRotation(map1, 1);
        enableRightClickDragRotation(map2, 2);

        [1, 2].forEach(num => {
            document.getElementById(`btnResetNorth${num}`).addEventListener('click', () => {
                applyMapBearing(num, 0, true);
            });
            document.getElementById(`btnToggleRotPanel${num}`).addEventListener('click', (e) => {
                e.stopPropagation();
                document.getElementById(`rotPanel${num}`).classList.toggle('hidden');
            });
            document.getElementById(`bearingSlider${num}`).addEventListener('input', (e) => {
                applyMapBearing(num, parseFloat(e.target.value), true);
            });
        });

        document.querySelectorAll('.quick-rot-btn').forEach(btn => {
            btn.addEventListener('click', () => applyMapBearing(parseInt(btn.dataset.map, 10), parseFloat(btn.dataset.angle), true));
        });

        document.querySelectorAll('.delta-rot-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const mapNum = parseInt(btn.dataset.map, 10);
                const current = mapNum === 1 ? state.map1Bearing : state.map2Bearing;
                applyMapBearing(mapNum, current + parseFloat(btn.dataset.delta), true);
            });
        });

        /**************************************************************************
         * BUSCADOR DE UBICACIONES INDEPENDIENTE
         **************************************************************************/
        function parseCoordinatesQuery(query) {
            const match = query.trim().match(/^(-?\d+(?:\.\d+)?)\s*[,;\s]\s*(-?\d+(?:\.\d+)?)$/);
            if (!match) return null;
            const lat = parseFloat(match[1]);
            const lng = parseFloat(match[2]);
            if (lat >= -90 && lat <= 90 && lng >= -180 && lng <= 180) {
                return { lat, lon: lng, display_name: `Coordenadas (${lat.toFixed(5)}, ${lng.toFixed(5)})` };
            }
            return null;
        }

        function createSearchPinIcon(mapNum) {
            const colorClass = mapNum === 1
                ? 'bg-blue-600 border-blue-200 shadow-blue-500/50'
                : 'bg-emerald-600 border-emerald-200 shadow-emerald-500/50';
            return L.divIcon({
                className: 'custom-search-pin',
                html: `<div class="w-7 h-7 -ml-3.5 -mt-7 rounded-full ${colorClass} border-2 shadow-lg flex items-center justify-center text-white text-xs animate-bounce">
                        <i class="fa-solid fa-location-dot"></i>
                       </div>`,
                iconSize: [28, 28],
                popupAnchor: [0, -28]
            });
        }

        function selectSearchResult(mapNum, item) {
            const targetMap = mapNum === 1 ? map1 : map2;
            const otherMap = mapNum === 1 ? map2 : map1;
            const targetProj = mapNum === 1 ? state.map1Proj : state.map2Proj;
            const otherProj = mapNum === 1 ? state.map2Proj : state.map1Proj;

            const resultsBox = document.getElementById(`searchResults${mapNum}`);
            const inputEl = document.getElementById(`searchInput${mapNum}`);
            const clearBtn = document.getElementById(`btnClearSearch${mapNum}`);

            const lat = parseFloat(item.lat);
            const lng = parseFloat(item.lon !== undefined ? item.lon : item.lng);
            if (isNaN(lat) || isNaN(lng)) return;

            const label = item.display_name || `${lat.toFixed(4)}, ${lng.toFixed(4)}`;
            const shortName = label.split(',')[0];

            resultsBox.classList.add('hidden');
            inputEl.value = shortName;
            clearBtn.classList.remove('hidden');

            let desiredBaseZoom = 14.5;
            if (item.boundingbox && item.boundingbox.length === 4) {
                const south = parseFloat(item.boundingbox[0]);
                const north = parseFloat(item.boundingbox[1]);
                const diff = Math.abs(north - south);
                if (diff > 15) desiredBaseZoom = 4.5;
                else if (diff > 5) desiredBaseZoom = 6;
                else if (diff > 1.5) desiredBaseZoom = 8.5;
                else if (diff > 0.4) desiredBaseZoom = 11.5;
                else if (diff > 0.08) desiredBaseZoom = 13.5;
                else desiredBaseZoom = 15.5;
            }

            state.baseZoom = desiredBaseZoom;
            const effectiveTargetZoom = computeEffectiveMapZoom(state.baseZoom, targetProj, lat);

            state.isProgrammaticMove = true;
            targetMap.stop();
            targetMap.setView([lat, lng], effectiveTargetZoom, { animate: false });

            if (mapNum === 1) {
                if (searchMarker1) map1.removeLayer(searchMarker1);
                searchMarker1 = L.marker([lat, lng], { icon: createSearchPinIcon(1) })
                    .addTo(map1)
                    .bindPopup(`<div class="text-slate-900 text-xs font-medium"><strong>Mapa 1:</strong> ${label}</div>`)
                    .openPopup();
            } else {
                if (searchMarker2) map2.removeLayer(searchMarker2);
                searchMarker2 = L.marker([lat, lng], { icon: createSearchPinIcon(2) })
                    .addTo(map2)
                    .bindPopup(`<div class="text-slate-900 text-xs font-medium"><strong>Mapa 2:</strong> ${label}</div>`)
                    .openPopup();
            }

            otherMap.stop();
            if (state.syncZoom) {
                const otherLat = otherMap.getCenter().lat;
                otherMap.setZoom(computeEffectiveMapZoom(state.baseZoom, otherProj, otherLat), { animate: false });
            }

            state.lastCenter1 = { lat: map1.getCenter().lat, lng: map1.getCenter().lng };
            state.lastCenter2 = { lat: map2.getCenter().lat, lng: map2.getCenter().lng };

            applyGallPetersAspectTransform(1);
            applyGallPetersAspectTransform(2);
            updateCoordsDisplay();
            updateScaleBadges();
            fetchCenterElevation(1, state.lastCenter1.lat, state.lastCenter1.lng);
            fetchCenterElevation(2, state.lastCenter2.lat, state.lastCenter2.lng);

            setTimeout(() => {
                state.isProgrammaticMove = false;
                syncOverlayMaps();
            }, 250);
        }

        function clearSearchMap(mapNum) {
            const inputEl = document.getElementById(`searchInput${mapNum}`);
            const resultsBox = document.getElementById(`searchResults${mapNum}`);
            const clearBtn = document.getElementById(`btnClearSearch${mapNum}`);

            inputEl.value = '';
            resultsBox.innerHTML = '';
            resultsBox.classList.add('hidden');
            clearBtn.classList.add('hidden');
            state.lastSearchResults[mapNum] = [];

            if (mapNum === 1 && searchMarker1) {
                map1.removeLayer(searchMarker1);
                searchMarker1 = null;
            } else if (mapNum === 2 && searchMarker2) {
                map2.removeLayer(searchMarker2);
                searchMarker2 = null;
            }
        }

        async function performMapSearch(mapNum, autoNavigateFirst = false) {
            const inputEl = document.getElementById(`searchInput${mapNum}`);
            const resultsBox = document.getElementById(`searchResults${mapNum}`);
            const iconEl = document.getElementById(`searchIcon${mapNum}`);
            const clearBtn = document.getElementById(`btnClearSearch${mapNum}`);
            const query = inputEl.value.trim();

            if (!query) return;
            clearBtn.classList.remove('hidden');

            const directCoords = parseCoordinatesQuery(query);
            if (directCoords) {
                selectSearchResult(mapNum, directCoords);
                return;
            }

            iconEl.className = 'fa-solid fa-spinner fa-spin';
            try {
                const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&limit=6&accept-language=es`;
                const response = await fetch(url, { headers: { 'Accept': 'application/json' } });
                const results = await response.json();

                resultsBox.innerHTML = '';
                state.lastSearchResults[mapNum] = Array.isArray(results) ? results : [];

                if (!Array.isArray(results) || results.length === 0) {
                    resultsBox.innerHTML = `<div class="px-3 py-2.5 text-xs text-slate-400">Sin resultados para "${query}"</div>`;
                    resultsBox.classList.remove('hidden');
                    return;
                }

                if (autoNavigateFirst) {
                    selectSearchResult(mapNum, results[0]);
                    return;
                }

                results.forEach((item) => {
                    const btn = document.createElement('button');
                    btn.type = 'button';
                    btn.className = 'w-full text-left px-3 py-2 hover:bg-slate-800/90 transition flex items-start gap-2.5 group';
                    const parts = item.display_name.split(',');
                    const title = parts[0];
                    const subtitle = parts.slice(1, 4).join(',').trim();

                    btn.innerHTML = `
                        <i class="fa-solid fa-location-dot mt-1 text-xs ${mapNum === 1 ? 'text-blue-400' : 'text-emerald-400'}"></i>
                        <div class="min-w-0 flex-1">
                            <div class="text-xs font-semibold text-slate-100 truncate">${title}</div>
                            <div class="text-[11px] text-slate-400 truncate">${subtitle || item.display_name}</div>
                        </div>
                    `;

                    btn.addEventListener('mousedown', (e) => {
                        e.preventDefault();
                        e.stopPropagation();
                        selectSearchResult(mapNum, item);
                    });

                    resultsBox.appendChild(btn);
                });

                resultsBox.classList.remove('hidden');
            } catch (err) {
                showToast('Error al buscar ubicación');
            } finally {
                iconEl.className = 'fa-solid fa-magnifying-glass';
            }
        }

        [1, 2].forEach(mapNum => {
            const form = document.getElementById(`searchForm${mapNum}`);
            const input = document.getElementById(`searchInput${mapNum}`);
            const clearBtn = document.getElementById(`btnClearSearch${mapNum}`);
            const resultsBox = document.getElementById(`searchResults${mapNum}`);
            let debounceTimer = null;

            L.DomEvent.disableClickPropagation(form);
            L.DomEvent.disableClickPropagation(resultsBox);
            L.DomEvent.disableScrollPropagation(resultsBox);

            form.addEventListener('submit', (e) => {
                e.preventDefault();
                clearTimeout(debounceTimer);
                if (!resultsBox.classList.contains('hidden') && state.lastSearchResults[mapNum].length > 0) {
                    selectSearchResult(mapNum, state.lastSearchResults[mapNum][0]);
                } else {
                    performMapSearch(mapNum, true);
                }
            });

            input.addEventListener('input', () => {
                clearTimeout(debounceTimer);
                const val = input.value.trim();
                if (val.length > 0) {
                    clearBtn.classList.remove('hidden');
                    if (val.length >= 3) debounceTimer = setTimeout(() => performMapSearch(mapNum, false), 350);
                } else {
                    clearBtn.classList.add('hidden');
                    resultsBox.classList.add('hidden');
                }
            });

            clearBtn.addEventListener('click', () => clearSearchMap(mapNum));
        });

        document.addEventListener('click', (e) => {
            [1, 2].forEach(num => {
                const form = document.getElementById(`searchForm${num}`);
                const resultsBox = document.getElementById(`searchResults${num}`);
                if (!form.contains(e.target) && !resultsBox.contains(e.target)) {
                    resultsBox.classList.add('hidden');
                }
            });
        });

        /**************************************************************************
         * GESTIÓN DE CAPAS DE GOOGLE MAPS
         **************************************************************************/
        function setMapLayer(mapNumber, layerType) {
            if (mapNumber === 1) {
                state.map1LayerType = layerType;
                map1.removeLayer(activeTileLayer1);
                activeTileLayer1 = createGoogleTileLayer(layerType).addTo(map1);
                overlayMap1.removeLayer(overlayTileLayer1);
                overlayTileLayer1 = createGoogleTileLayer(layerType).addTo(overlayMap1);
                updateLayerButtonsUI(1, layerType);
            } else {
                state.map2LayerType = layerType;
                map2.removeLayer(activeTileLayer2);
                activeTileLayer2 = createGoogleTileLayer(layerType).addTo(map2);
                overlayMap2.removeLayer(overlayTileLayer2);
                overlayTileLayer2 = createGoogleTileLayer(layerType).addTo(overlayMap2);
                updateLayerButtonsUI(2, layerType);
            }
            syncOverlayMaps();
        }

        function updateLayerButtonsUI(mapNumber, activeLayer) {
            const buttons = document.querySelectorAll(`.layer-btn-${mapNumber}`);
            const activeColorClass = mapNumber === 1 ? 'bg-blue-600' : 'bg-emerald-600';

            buttons.forEach(btn => {
                const isTarget = btn.getAttribute('data-layer') === activeLayer;
                btn.classList.remove('bg-blue-600', 'bg-emerald-600', 'text-white', 'shadow', 'text-slate-400');
                if (isTarget) btn.classList.add(activeColorClass, 'text-white', 'shadow');
                else btn.classList.add('text-slate-400');
            });
        }

        document.querySelectorAll('.layer-btn-1').forEach(btn => btn.addEventListener('click', () => setMapLayer(1, btn.dataset.layer)));
        document.querySelectorAll('.layer-btn-2').forEach(btn => btn.addEventListener('click', () => setMapLayer(2, btn.dataset.layer)));

        /**************************************************************************
         * SINCRONIZACIÓN DE ZOOM, PAN RELATIVO Y ALTITUD CENTRAL
         **************************************************************************/
        function updateCoordsDisplay() {
            const c1 = map1.getCenter();
            const c2 = map2.getCenter();
            document.getElementById('coordsMap1').textContent = `${c1.lat.toFixed(4)}, ${c1.lng.toFixed(4)}`;
            document.getElementById('coordsMap2').textContent = `${c2.lat.toFixed(4)}, ${c2.lng.toFixed(4)}`;
        }

        function handleMapSync(sourceMap, targetMap, sourceId) {
            updateCoordsDisplay();
            updateScaleBadges();

            const c1Now = map1.getCenter();
            const c2Now = map2.getCenter();
            scheduleElevationFetch(1, c1Now.lat, c1Now.lng);
            scheduleElevationFetch(2, c2Now.lat, c2Now.lng);

            if (!state.isProgrammaticMove) {
                state.isProgrammaticMove = true;
                const isSource1 = sourceId === 'map1';
                const sourceNum = isSource1 ? 1 : 2;
                const targetNum = isSource1 ? 2 : 1;
                const sourceProj = isSource1 ? state.map1Proj : state.map2Proj;
                const targetProj = isSource1 ? state.map2Proj : state.map1Proj;

                const sCenter = sourceMap.getCenter();
                const sZoom = sourceMap.getZoom();
                const prevCenter = isSource1 ? state.lastCenter1 : state.lastCenter2;

                const dLat = sCenter.lat - prevCenter.lat;
                const dLng = sCenter.lng - prevCenter.lng;

                state.baseZoom = computeBaseZoomFromEffective(sZoom, sourceProj, sCenter.lat);
                applyGallPetersAspectTransform(sourceNum);

                if (isSource1) state.lastCenter1 = { lat: sCenter.lat, lng: sCenter.lng };
                else state.lastCenter2 = { lat: sCenter.lat, lng: sCenter.lng };

                const tCenter = targetMap.getCenter();
                const hasDelta = Math.abs(dLat) > 1e-9 || Math.abs(dLng) > 1e-9;
                const nextLat = (state.syncPan && hasDelta) ? Math.max(-84, Math.min(84, tCenter.lat + dLat)) : tCenter.lat;
                const nextLng = (state.syncPan && hasDelta) ? tCenter.lng + dLng : tCenter.lng;

                const nextTargetZoom = state.syncZoom
                    ? computeEffectiveMapZoom(state.baseZoom, targetProj, nextLat)
                    : targetMap.getZoom();

                if (state.syncZoom || (state.syncPan && hasDelta)) {
                    targetMap.setView([nextLat, nextLng], nextTargetZoom, { animate: false });
                } else if (sourceProj === 'true_size' || sourceProj === 'gall_peters') {
                    const adjustedSourceZoom = computeEffectiveMapZoom(state.baseZoom, sourceProj, sCenter.lat);
                    if (Math.abs(adjustedSourceZoom - sZoom) > 0.002) {
                        sourceMap.setZoom(adjustedSourceZoom, { animate: false });
                    }
                }

                applyGallPetersAspectTransform(targetNum);

                const updatedTargetCenter = targetMap.getCenter();
                if (targetNum === 1) state.lastCenter1 = { lat: updatedTargetCenter.lat, lng: updatedTargetCenter.lng };
                else state.lastCenter2 = { lat: updatedTargetCenter.lat, lng: updatedTargetCenter.lng };
            }

            syncOverlayMaps();

            requestAnimationFrame(() => {
                state.isProgrammaticMove = false;
            });
        }

        map1.on('zoom move', () => handleMapSync(map1, map2, 'map1'));
        map2.on('zoom move', () => handleMapSync(map2, map1, 'map2'));

        /**************************************************************************
         * MEDIDOR DE DISTANCIA ULTRA-COMPACTO E INDEPENDIENTE POR MAPA
         **************************************************************************/
        function formatDistanceCompact(meters) {
            if (meters >= 1000) {
                return `${(meters / 1000).toFixed(2)} km`;
            }
            return `${meters.toFixed(1)} m`;
        }

        function createMarkerIcon(index, isLast, mapNum) {
            const accent = mapNum === 1 ? 'bg-blue-500' : 'bg-emerald-500';
            const bgColor = index === 0 ? accent : (isLast ? 'bg-rose-500 measure-dot-pulse' : 'bg-rose-500');
            return L.divIcon({
                className: 'custom-measure-point',
                html: `<div class="relative w-5 h-5 -ml-1 -mt-1 rounded-full ${bgColor} border-2 border-white shadow-lg flex items-center justify-center text-[9px] font-mono font-bold text-white">${index + 1}</div>`,
                iconSize: [10, 10]
            });
        }

        function renderMeasurementsForMap(mapNum) {
            const targetLayerGroup = mapNum === 1 ? measureLayerGroup1 : measureLayerGroup2;
            const referenceMap = mapNum === 1 ? map1 : map2;
            const pts = mapNum === 1 ? state.measurePoints1 : state.measurePoints2;
            const lineColor = mapNum === 1 ? '#38bdf8' : '#34d399';

            targetLayerGroup.clearLayers();
            if (pts.length === 0) return;

            const latLngs = pts.map(p => [p.lat, p.lng]);

            if (pts.length > 1) {
                L.polyline(latLngs, { color: '#0f172a', weight: 5, opacity: 0.75 }).addTo(targetLayerGroup);
                L.polyline(latLngs, { color: lineColor, weight: 3, dashArray: '7, 5', opacity: 1 }).addTo(targetLayerGroup);

                for (let i = 1; i < pts.length; i++) {
                    const p1 = L.latLng(pts[i - 1].lat, pts[i - 1].lng);
                    const p2 = L.latLng(pts[i].lat, pts[i].lng);
                    const segDist = referenceMap.distance(p1, p2);
                    const midLat = (p1.lat + p2.lat) / 2;
                    const midLng = (p1.lng + p2.lng) / 2;

                    const labelText = segDist >= 1000 ? `${(segDist / 1000).toFixed(2)} km` : `${Math.round(segDist)} m`;

                    L.tooltip({ permanent: true, direction: 'center', className: 'segment-tooltip' })
                        .setLatLng([midLat, midLng])
                        .setContent(labelText)
                        .addTo(targetLayerGroup);
                }
            }

            pts.forEach((pt, idx) => {
                L.marker([pt.lat, pt.lng], { icon: createMarkerIcon(idx, idx === pts.length - 1, mapNum), interactive: false }).addTo(targetLayerGroup);
            });
        }

        function updateMeasurementUI() {
            [1, 2].forEach(mapNum => {
                renderMeasurementsForMap(mapNum);
                const pts = mapNum === 1 ? state.measurePoints1 : state.measurePoints2;
                const refMap = mapNum === 1 ? map1 : map2;

                let totalMeters = 0;
                for (let i = 1; i < pts.length; i++) {
                    totalMeters += refMap.distance([pts[i - 1].lat, pts[i - 1].lng], [pts[i].lat, pts[i].lng]);
                }

                const compactDist = formatDistanceCompact(totalMeters);
                document.getElementById(`distPrimary${mapNum}`).textContent = compactDist;
                document.getElementById(`measureCount${mapNum}`).textContent = `(${pts.length})`;
                document.getElementById(`btnUndoMeasure${mapNum}`).disabled = pts.length === 0;

                const card = document.getElementById(`measureCard${mapNum}`);
                const localBadge = document.getElementById(`localMeasureBadge${mapNum}`);
                if (state.isMeasuring || pts.length > 0) card.classList.remove('hidden');
                else card.classList.add('hidden');

                localBadge.textContent = pts.length > 0 ? compactDist : 'Medir';
            });
        }

        function addMeasurementPoint(mapNum, latlng) {
            if (mapNum === 1) state.measurePoints1.push({ lat: latlng.lat, lng: latlng.lng });
            else state.measurePoints2.push({ lat: latlng.lat, lng: latlng.lng });
            updateMeasurementUI();
        }

        function clearMapMeasurement(mapNum) {
            if (mapNum === 1) state.measurePoints1 = [];
            else state.measurePoints2 = [];
            if (state.measurePoints1.length === 0 && state.measurePoints2.length === 0) {
                toggleMeasureMode(false);
            } else {
                updateMeasurementUI();
            }
        }

        function toggleMeasureMode(forceState) {
            state.isMeasuring = typeof forceState === 'boolean' ? forceState : !state.isMeasuring;
            const container = document.getElementById('mapsGridContainer');

            if (state.isMeasuring) {
                container.classList.add('measuring-cursor');
            } else {
                container.classList.remove('measuring-cursor');
            }
            updateMeasurementUI();
        }

        map1.on('click', (e) => { if (state.isMeasuring) addMeasurementPoint(1, e.latlng); });
        map2.on('click', (e) => { if (state.isMeasuring) addMeasurementPoint(2, e.latlng); });

        [1, 2].forEach(num => {
            const card = document.getElementById(`measureCard${num}`);
            L.DomEvent.disableClickPropagation(card);

            document.getElementById(`btnLocalMeasure${num}`).addEventListener('click', (e) => {
                e.stopPropagation();
                toggleMeasureMode(!state.isMeasuring);
            });

            document.getElementById(`btnUndoMeasure${num}`).addEventListener('click', () => {
                if (num === 1) state.measurePoints1.pop();
                else state.measurePoints2.pop();
                updateMeasurementUI();
            });

            document.getElementById(`btnClearMeasure${num}`).addEventListener('click', () => clearMapMeasurement(num));
        });

        /**************************************************************************
         * CONTROLES DE BARRA SUPERIOR Y MODO LIMPIO
         **************************************************************************/
        function showToast(message) {
            const toast = document.getElementById('toastNotification');
            document.getElementById('toastMessage').textContent = message;
            toast.classList.remove('opacity-0', 'translate-y-2');
            toast.classList.add('opacity-100', 'translate-y-0');

            clearTimeout(window._toastTimer);
            window._toastTimer = setTimeout(() => {
                toast.classList.remove('opacity-100', 'translate-y-0');
                toast.classList.add('opacity-0', 'translate-y-2');
            }, 2600);
        }

        function updateSyncButtonsUI() {
            const btnZoom = document.getElementById('btnSyncZoom');
            const dotZoom = document.getElementById('dotSyncZoom');
            const btnPan = document.getElementById('btnSyncPan');
            const dotPan = document.getElementById('dotSyncPan');
            const btnBearing = document.getElementById('btnSyncBearing');
            const dotBearing = document.getElementById('dotSyncBearing');

            if (state.syncZoom) {
                btnZoom.className = 'has-tooltip relative w-8 h-8 sm:w-9 sm:h-9 rounded-xl flex items-center justify-center transition-all border bg-blue-600/20 border-blue-500/50 text-blue-300 shadow-sm';
                dotZoom.className = 'absolute top-1 right-1 w-1.5 h-1.5 rounded-full bg-emerald-400 shadow-[0_0_6px_#34d399]';
            } else {
                btnZoom.className = 'has-tooltip relative w-8 h-8 sm:w-9 sm:h-9 rounded-xl flex items-center justify-center transition-all border bg-slate-800/90 border-slate-700 text-slate-400';
                dotZoom.className = 'absolute top-1 right-1 w-1.5 h-1.5 rounded-full bg-slate-600';
            }

            if (state.syncPan) {
                btnPan.className = 'has-tooltip relative w-8 h-8 sm:w-9 sm:h-9 rounded-xl flex items-center justify-center transition-all border bg-indigo-600/20 border-indigo-500/50 text-indigo-300 shadow-sm';
                dotPan.className = 'absolute top-1 right-1 w-1.5 h-1.5 rounded-full bg-emerald-400 shadow-[0_0_6px_#34d399]';
            } else {
                btnPan.className = 'has-tooltip relative w-8 h-8 sm:w-9 sm:h-9 rounded-xl flex items-center justify-center transition-all border bg-slate-800/90 border-slate-700 text-slate-300 hover:bg-slate-750';
                dotPan.className = 'absolute top-1 right-1 w-1.5 h-1.5 rounded-full bg-slate-600';
            }

            if (state.syncBearing) {
                btnBearing.className = 'has-tooltip relative w-8 h-8 sm:w-9 sm:h-9 rounded-xl flex items-center justify-center transition-all border bg-amber-500/20 border-amber-500/50 text-amber-300 shadow-sm';
                dotBearing.className = 'absolute top-1 right-1 w-1.5 h-1.5 rounded-full bg-emerald-400 shadow-[0_0_6px_#34d399]';
            } else {
                btnBearing.className = 'has-tooltip relative w-8 h-8 sm:w-9 sm:h-9 rounded-xl flex items-center justify-center transition-all border bg-slate-800/90 border-slate-700 text-slate-300 hover:bg-slate-750';
                dotBearing.className = 'absolute top-1 right-1 w-1.5 h-1.5 rounded-full bg-slate-600';
            }
        }

        document.getElementById('btnSyncZoom').addEventListener('click', () => {
            state.syncZoom = !state.syncZoom;
            updateSyncButtonsUI();
            if (state.syncZoom) {
                state.isProgrammaticMove = true;
                map2.setZoom(computeEffectiveMapZoom(state.baseZoom, state.map2Proj, map2.getCenter().lat), { animate: true });
                setTimeout(() => { state.isProgrammaticMove = false; }, 200);
                showToast('Zoom sincronizado activado');
            } else {
                showToast('Zoom sincronizado desactivado');
            }
        });

        document.getElementById('btnSyncPan').addEventListener('click', () => {
            state.syncPan = !state.syncPan;
            state.lastCenter1 = { lat: map1.getCenter().lat, lng: map1.getCenter().lng };
            state.lastCenter2 = { lat: map2.getCenter().lat, lng: map2.getCenter().lng };
            updateSyncButtonsUI();
            showToast(state.syncPan ? 'Posición sincronizada activa' : 'Posición independiente');
        });

        document.getElementById('btnSyncBearing').addEventListener('click', () => {
            state.syncBearing = !state.syncBearing;
            updateSyncButtonsUI();
            if (state.syncBearing) applyMapBearing(2, state.map1Bearing, false);
            showToast(state.syncBearing ? 'Giro sincronizado' : 'Giro independiente');
        });

        document.getElementById('btnAlignNow').addEventListener('click', () => {
            state.isProgrammaticMove = true;
            const c1 = map1.getCenter();
            map2.setView(c1, computeEffectiveMapZoom(state.baseZoom, state.map2Proj, c1.lat), { animate: true });
            applyMapBearing(2, state.map1Bearing, false);
            applyGallPetersAspectTransform(2);
            state.lastCenter1 = { lat: c1.lat, lng: c1.lng };
            state.lastCenter2 = { lat: c1.lat, lng: c1.lng };
            updateCoordsDisplay();
            updateScaleBadges();
            fetchCenterElevation(2, c1.lat, c1.lng);
            setTimeout(() => { state.isProgrammaticMove = false; syncOverlayMaps(); }, 250);
            showToast('Vistas igualadas');
        });

        function setMapCleanMode(mapNum, isClean) {
            state.cleanMode[mapNum] = isClean;
            const panel = document.getElementById(`panelMap${mapNum}`);
            const topOverlay = document.getElementById(`uiTopOverlay${mapNum}`);
            const compassOverlay = document.getElementById(`uiCompassOverlay${mapNum}`);
            const iconBtn = document.getElementById(`iconCleanMap${mapNum}`);
            const btnClean = document.getElementById(`btnCleanMap${mapNum}`);

            if (isClean) {
                panel.classList.add('map-ui-hidden');
                topOverlay.classList.add('hidden');
                compassOverlay.classList.add('hidden');
                iconBtn.className = 'fa-solid fa-eye text-xs text-amber-400';
                btnClean.classList.add('opacity-70', 'hover:opacity-100');
            } else {
                panel.classList.remove('map-ui-hidden');
                topOverlay.classList.remove('hidden');
                compassOverlay.classList.remove('hidden');
                iconBtn.className = `fa-solid fa-eye-slash text-xs ${mapNum === 1 ? 'text-blue-400' : 'text-emerald-400'}`;
                btnClean.classList.remove('opacity-70', 'hover:opacity-100');
            }
        }

        document.getElementById('btnCleanMap1').addEventListener('click', () => setMapCleanMode(1, !state.cleanMode[1]));
        document.getElementById('btnCleanMap2').addEventListener('click', () => setMapCleanMode(2, !state.cleanMode[2]));

        function applySplitDirection(direction) {
            state.splitDirection = direction;
            const container = document.getElementById('mapsGridContainer');
            const panel1 = document.getElementById('panelMap1');
            const icon = document.getElementById('iconSplitLayout');

            if (direction === 'horizontal') {
                container.classList.remove('flex-row');
                container.classList.add('flex-col');
                panel1.classList.remove('border-r');
                panel1.classList.add('border-b');
                icon.className = 'fa-solid fa-bars text-xs sm:text-sm text-cyan-400';
            } else {
                container.classList.remove('flex-col');
                container.classList.add('flex-row');
                panel1.classList.remove('border-b');
                panel1.classList.add('border-r');
                icon.className = 'fa-solid fa-table-columns text-xs sm:text-sm text-cyan-400';
            }

            setTimeout(() => { map1.invalidateSize(); map2.invalidateSize(); }, 180);
        }

        // Aplicar distribución inicial automática (horizontal en móvil/vertical, vertical en PC)
        applySplitDirection(state.splitDirection);
        setMapCleanMode(1, true);
        setMapCleanMode(2, true);

        document.getElementById('btnToggleSplitLayout').addEventListener('click', () => {
            applySplitDirection(state.splitDirection === 'vertical' ? 'horizontal' : 'vertical');
        });

        window.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && state.isMeasuring) toggleMeasureMode(false);
        });

        let lastOrientationPortrait = isMobileOrPortrait();
        window.addEventListener('resize', () => {
            const currentPortrait = isMobileOrPortrait();
            if (currentPortrait !== lastOrientationPortrait) {
                lastOrientationPortrait = currentPortrait;
                applySplitDirection(currentPortrait ? 'horizontal' : 'vertical');
            }
            map1.invalidateSize();
            map2.invalidateSize();
            if (state.overlayActive) {
                overlayMap1.invalidateSize();
                overlayMap2.invalidateSize();
                syncOverlayMaps();
            }
        });
    </script>
</body>
</html>
