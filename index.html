<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0A0F1D">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Comparamapas">
    <title>Comparamapas - Comparador y Medidor de Mapas</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230A0F1D'/%3E%3Cpath d='M8 10l6-3v15l-6 3V10zm8 3l6-3v15l-6 3V13z' fill='%2300E5FF'/%3E%3C/svg%3E">
    <link id="pwaManifestLink" rel="manifest" href="">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts: Inter & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    
    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <!-- Leaflet Rotate Plugin -->
    <script src="https://unpkg.com/leaflet-rotate@0.2.8/dist/leaflet-rotate-src.js"></script>

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    }
                }
            }
        }
    </script>

    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            background-color: #0f172a;
        }

        .leaflet-container {
            background-color: #0f172a;
            font-family: 'Inter', sans-serif;
            transition: transform 0.22s cubic-bezier(0.22, 1, 0.36, 1);
            transform-origin: center center;
        }

        .leaflet-control-zoom {
            border: 1px solid rgba(255, 255, 255, 0.15) !important;
            border-radius: 0.75rem !important;
            overflow: hidden;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.4) !important;
        }

        .leaflet-control-zoom a {
            background-color: rgba(15, 23, 42, 0.88) !important;
            backdrop-filter: blur(8px);
            color: #f8fafc !important;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1) !important;
            width: 34px !important;
            height: 34px !important;
            line-height: 34px !important;
            font-size: 15px !important;
            transition: all 0.15s ease;
        }

        .leaflet-control-zoom a:hover {
            background-color: rgba(59, 130, 246, 0.9) !important;
            color: #ffffff !important;
        }

        .segment-tooltip {
            background: rgba(15, 23, 42, 0.92) !important;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(244, 63, 94, 0.6) !important;
            color: #f8fafc !important;
            font-family: 'JetBrains Mono', monospace !important;
            font-size: 11px !important;
            font-weight: 600 !important;
            padding: 2px 6px !important;
            border-radius: 6px !important;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3) !important;
            white-space: nowrap;
        }

        .segment-tooltip::before {
            display: none !important;
        }

        .measuring-cursor .leaflet-container {
            cursor: crosshair !important;
        }

        @keyframes pulse-ring {
            0% { transform: scale(0.8); opacity: 0.8; }
            100% { transform: scale(2.2); opacity: 0; }
        }
        .measure-dot-pulse::after {
            content: '';
            position: absolute;
            inset: -4px;
            border-radius: 50%;
            border: 2px solid #f43f5e;
            animation: pulse-ring 1.8s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
        }

        .leaflet-control-rotate {
            display: none !important;
        }

        input[type=range].bearing-slider {
            -webkit-appearance: none;
            appearance: none;
            background: transparent;
            cursor: pointer;
        }
        input[type=range].bearing-slider::-webkit-slider-runnable-track {
            height: 5px;
            border-radius: 999px;
            background: rgba(51, 65, 85, 0.9);
        }
        input[type=range].bearing-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #00E5FF;
            border: 2px solid #ffffff;
            margin-top: -4.5px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.5);
        }

        .map-ui-hidden .leaflet-control-zoom,
        .map-ui-hidden .leaflet-control-scale {
            display: none !important;
        }

        input[type=range].opacity-slider {
            -webkit-appearance: none;
            appearance: none;
            background: transparent;
            cursor: pointer;
        }
        input[type=range].opacity-slider::-webkit-slider-runnable-track {
            height: 6px;
            border-radius: 999px;
            background: linear-gradient(90deg, rgba(59,130,246,0.6) 0%, rgba(16,185,129,0.9) 100%);
        }
        input[type=range].opacity-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 15px;
            height: 15px;
            border-radius: 50%;
            background: #ffffff;
            border: 2px solid #00E5FF;
            margin-top: -4.5px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.6);
        }

        #overlayMiniWindow .leaflet-control-container {
            display: none !important;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 h-screen flex flex-col font-sans select-none">

    <!-- BARRA SUPERIOR COMPACTA EN UNA SOLA LÍNEA: TÍTULO A LA IZQUIERDA Y SOLO ICONOS CON TOOLTIP A LA DERECHA -->
    <header class="h-12 px-2.5 sm:px-4 bg-slate-900/95 backdrop-blur-xl border-b border-slate-800 flex items-center justify-between gap-2 shrink-0 z-[1000] shadow-lg">
        <!-- Logo Oficial Comparamapas -->
        <div class="flex items-center gap-2 min-w-0">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" class="w-7 h-7 sm:w-8 sm:h-8 rounded-lg shadow-md shadow-cyan-500/10 border border-slate-700/80 shrink-0">
                <rect width="32" height="32" rx="8" fill="#0A0F1D"/>
                <path d="M8 10l6-3v15l-6 3V10zm8 3l6-3v15l-6 3V13z" fill="#00E5FF"/>
            </svg>
            <h1 class="font-bold text-sm sm:text-base tracking-tight text-slate-100 truncate">Compara<span class="text-[#00E5FF]">mapas</span></h1>
        </div>

        <!-- Botones solo con iconos alineados a la derecha con Tooltip (hover y pulsación larga) -->
        <div class="flex items-center gap-1 sm:gap-1.5 shrink-0">
            <!-- Toggle Zoom Sincronizado -->
            <button id="btnSyncZoom" data-tooltip="Zoom sincronizado: iguala el nivel de escala entre ambos mapas" class="has-tooltip relative w-8 h-8 sm:w-9 sm:h-9 rounded-xl flex items-center justify-center transition-all border bg-blue-600/20 border-blue-500/50 text-blue-300 shadow-sm">
                <i class="fa-solid fa-magnifying-glass-plus text-xs sm:text-sm text-blue-400"></i>
                <span id="dotSyncZoom" class="absolute top-1 right-1 w-1.5 h-1.5 rounded-full bg-emerald-400 shadow-[0_0_6px_#34d399]"></span>
            </button>

            <!-- Toggle Posición / Movimiento Relativo Sincronizado -->
            <button id="btnSyncPan" data-tooltip="Posición sincronizada: mueve ambos mapas manteniendo su separación" class="has-tooltip relative w-8 h-8 sm:w-9 sm:h-9 rounded-xl flex items-center justify-center transition-all border bg-slate-800/90 border-slate-700 text-slate-300 hover:bg-slate-750">
                <i class="fa-solid fa-arrows-up-down-left-right text-xs sm:text-sm text-slate-400"></i>
                <span id="dotSyncPan" class="absolute top-1 right-1 w-1.5 h-1.5 rounded-full bg-slate-600"></span>
            </button>

            <!-- Toggle Giro / Norte Sincronizado -->
            <button id="btnSyncBearing" data-tooltip="Giro sincronizado: rota el Norte de ambos mapas a la vez" class="has-tooltip relative w-8 h-8 sm:w-9 sm:h-9 rounded-xl flex items-center justify-center transition-all border bg-slate-800/90 border-slate-700 text-slate-300 hover:bg-slate-750">
                <i class="fa-regular fa-compass text-xs sm:text-sm text-amber-400"></i>
                <span id="dotSyncBearing" class="absolute top-1 right-1 w-1.5 h-1.5 rounded-full bg-slate-600"></span>
            </button>

            <!-- Igualar vistas inmediatamente -->
            <button id="btnAlignNow" data-tooltip="Igualar vistas: lleva el Mapa 2 al mismo lugar y escala del Mapa 1" class="has-tooltip w-8 h-8 sm:w-9 sm:h-9 rounded-xl bg-slate-800/90 hover:bg-slate-700 text-slate-300 border border-slate-700 flex items-center justify-center transition">
                <i class="fa-solid fa-clone text-xs sm:text-sm text-cyan-400"></i>
            </button>

            <!-- Alternar División Vertical / Horizontal -->
            <button id="btnToggleSplitLayout" data-tooltip="División de pantalla: alternar entre Lado a Lado o Arriba y Abajo" class="has-tooltip w-8 h-8 sm:w-9 sm:h-9 rounded-xl bg-slate-800/90 hover:bg-slate-700 text-slate-200 border border-slate-700 flex items-center justify-center transition">
                <i id="iconSplitLayout" class="fa-solid fa-table-columns text-xs sm:text-sm text-cyan-400"></i>
            </button>

            <!-- Mini Ventana Superpuesta con Transparencia -->
            <button id="btnToggleOverlayWindow" data-tooltip="Superponer mapas: ventana flotante con transparencia ajustable" class="has-tooltip relative w-8 h-8 sm:w-9 sm:h-9 rounded-xl flex items-center justify-center transition-all border bg-slate-800/90 border-slate-700 text-cyan-300 hover:border-cyan-500/50">
                <i class="fa-solid fa-layer-group text-xs sm:text-sm text-[#00E5FF]"></i>
                <span id="dotOverlayActive" class="absolute top-1 right-1 w-1.5 h-1.5 rounded-full bg-slate-600"></span>
            </button>

            <!-- Botón Instalar App PWA en Chrome / Pantalla Completa -->
            <button id="btnInstallPWA" data-tooltip="Instalar Comparamapas en Chrome como aplicación a pantalla completa" class="has-tooltip w-8 h-8 sm:w-9 sm:h-9 rounded-xl bg-cyan-500/15 hover:bg-cyan-500/30 text-[#00E5FF] border border-cyan-500/40 flex items-center justify-center transition">
                <i class="fa-solid fa-download text-xs sm:text-sm"></i>
            </button>
        </div>
    </header>

    <!-- TOOLTIP FLOTANTE GLOBAL (HOVER Y PULSACIÓN LARGA TÁCTIL) -->
    <div id="customTooltip" class="pointer-events-none opacity-0 transition-opacity duration-150 fixed z-[2000] px-2.5 py-1.5 rounded-lg bg-slate-950/95 border border-cyan-500/40 text-slate-100 text-[11px] font-medium shadow-2xl max-w-[230px] text-center leading-snug"></div>

    <!-- CONTENEDOR PRINCIPAL DE LOS DOS MAPAS -->
    <main id="mapsGridContainer" class="flex-1 flex flex-row relative overflow-hidden bg-slate-950">
        
        <!-- ==================== PANEL MAPA 1 ==================== -->
        <section id="panelMap1" class="relative flex-1 w-full h-full border-r border-slate-800 transition-all duration-300 overflow-hidden bg-slate-950 map-ui-hidden">
            <div id="map1" class="w-full h-full z-10"></div>

            <!-- Cruz Central Fija (Retícula de Precisión) -->
            <div class="pointer-events-none absolute inset-0 z-[450] flex items-center justify-center">
                <div class="relative w-5 h-5 flex items-center justify-center">
                    <div class="absolute w-full h-[1.5px] bg-blue-400/90 shadow-[0_0_4px_rgba(0,0,0,0.9)]"></div>
                    <div class="absolute h-full w-[1.5px] bg-blue-400/90 shadow-[0_0_4px_rgba(0,0,0,0.9)]"></div>
                    <div class="w-1.5 h-1.5 rounded-full border border-white/90 bg-blue-500/40"></div>
                </div>
            </div>

            <!-- Botón Ocultar/Mostrar Controles (Modo Limpio - Oculto por defecto) -->
            <button id="btnCleanMap1" data-tooltip="Ocultar o mostrar controles del Mapa 1" class="has-tooltip absolute top-2.5 left-2.5 z-[650] w-8 h-8 rounded-xl bg-slate-900/90 hover:bg-slate-800 backdrop-blur-md border border-slate-700/80 text-slate-200 hover:text-white shadow-xl flex items-center justify-center transition pointer-events-auto opacity-70 hover:opacity-100">
                <i id="iconCleanMap1" class="fa-solid fa-eye text-xs text-amber-400"></i>
            </button>

            <!-- Tarjeta Flotante Superior: Identificador + Selector de Escala + Capas + Buscador Mapa 1 (Oculta por defecto) -->
            <div id="uiTopOverlay1" class="hidden absolute top-2.5 left-12 right-12 z-[500] flex flex-col gap-1.5 max-w-xl pointer-events-none transition-opacity duration-200">
                <div class="flex flex-wrap items-center gap-1 bg-slate-900/90 backdrop-blur-md border border-slate-700/80 p-1.5 rounded-xl shadow-xl pointer-events-auto w-fit max-w-full">
                    <div class="flex items-center gap-1.5 px-2 py-0.5 rounded-lg bg-blue-500/10 border border-blue-500/20">
                        <span class="w-2 h-2 rounded-full bg-blue-400"></span>
                        <span class="text-[11px] font-bold text-blue-200 tracking-wide">MAPA 1</span>
                    </div>

                    <select id="projSelect1" class="bg-slate-950/90 border border-slate-700 text-slate-200 text-[11px] rounded-lg px-2 py-1 font-medium focus:outline-none focus:border-blue-500 transition cursor-pointer">
                        <option value="mercator" selected>Mercator (Estándar)</option>
                        <option value="true_size">Tamaño Real (Escala cos lat)</option>
                        <option value="gall_peters">Gall-Peters (Área Equivalente)</option>
                    </select>

                    <div class="flex flex-wrap items-center bg-slate-950/80 p-0.5 rounded-lg border border-slate-800" data-map-target="1">
                        <button data-layer="streets" class="layer-btn-1 px-2 py-0.5 rounded-md text-[11px] font-medium transition bg-blue-600 text-white shadow">Calles</button>
                        <button data-layer="satellite" class="layer-btn-1 px-2 py-0.5 rounded-md text-[11px] font-medium transition text-slate-400 hover:text-white">Satélite</button>
                        <button data-layer="hybrid" class="layer-btn-1 px-2 py-0.5 rounded-md text-[11px] font-medium transition text-slate-400 hover:text-white">Híbrido</button>
                        <button data-layer="terrain" class="layer-btn-1 px-2 py-0.5 rounded-md text-[11px] font-medium transition text-slate-400 hover:text-white">Terreno</button>
                    </div>

                    <button id="btnLocalMeasure1" class="px-2 py-0.5 rounded-lg bg-slate-950/90 hover:bg-rose-600/30 border border-slate-700 text-slate-300 hover:text-rose-200 text-[11px] font-medium transition flex items-center gap-1">
                        <i class="fa-solid fa-ruler text-rose-400 text-[10px]"></i>
                        <span id="localMeasureBadge1" class="font-mono text-[10px]">Medir</span>
                    </button>
                </div>

                <!-- Buscador Independiente Mapa 1 -->
                <div class="relative w-full max-w-sm pointer-events-auto">
                    <form id="searchForm1" class="flex items-center bg-slate-900/95 backdrop-blur-md border border-slate-700/90 focus-within:border-blue-500 rounded-xl shadow-xl overflow-hidden transition">
                        <span class="pl-2.5 pr-1.5 text-blue-400 text-xs">
                            <i id="searchIcon1" class="fa-solid fa-magnifying-glass"></i>
                        </span>
                        <input id="searchInput1" type="text" autocomplete="off" placeholder="Buscar lugar, país o coords en Mapa 1..." class="w-full bg-transparent py-1.5 pr-2 text-xs text-slate-100 placeholder-slate-400 focus:outline-none" />
                        <button type="button" id="btnClearSearch1" class="hidden px-2 py-1 text-slate-400 hover:text-rose-400 text-xs transition">
                            <i class="fa-solid fa-xmark"></i>
                        </button>
                        <button type="submit" class="px-2.5 py-1.5 bg-blue-600/80 hover:bg-blue-500 text-white text-xs font-semibold transition border-l border-slate-700/80">Ir</button>
                    </form>
                    <div id="searchResults1" class="hidden absolute left-0 right-0 mt-1 bg-slate-900/95 backdrop-blur-xl border border-slate-700 rounded-xl shadow-2xl overflow-hidden max-h-60 overflow-y-auto divide-y divide-slate-800/80 z-[600]"></div>
                </div>
            </div>

            <!-- Control Flotante de Brújula y Rotación de Norte (Mapa 1 - Oculto por defecto) -->
            <div id="uiCompassOverlay1" class="hidden absolute top-28 right-2.5 z-[500] flex flex-col items-end gap-1.5 pointer-events-auto transition-opacity duration-200">
                <div class="bg-slate-900/90 backdrop-blur-md border border-slate-700/80 rounded-xl p-1.5 shadow-xl flex flex-col items-center gap-1">
                    <button id="btnResetNorth1" class="relative w-9 h-9 rounded-lg bg-slate-950/90 hover:bg-slate-800 border border-slate-800 flex items-center justify-center transition group">
                        <span class="absolute top-0.5 text-[8px] font-bold text-rose-400 tracking-tighter">N</span>
                        <div id="compassNeedle1" class="w-5 h-5 flex items-center justify-center transition-transform duration-75" style="transform: rotate(0deg);">
                            <svg viewBox="0 0 24 24" class="w-4 h-4">
                                <polygon points="12,2 16,12 12,10 8,12" fill="#f43f5e"/>
                                <polygon points="12,22 16,12 12,14 8,12" fill="#cbd5e1"/>
                            </svg>
                        </div>
                    </button>
                    <span id="bearingValue1" class="font-mono text-[10px] font-bold text-blue-300">0° N</span>
                    <button id="btnToggleRotPanel1" class="text-[10px] text-slate-400 hover:text-white px-1.5 py-0.5 rounded bg-slate-800/80 w-full text-center transition">
                        <i class="fa-solid fa-rotate"></i> Girar
                    </button>
                </div>

                <div id="rotPanel1" class="hidden bg-slate-900/95 backdrop-blur-md border border-slate-700/90 rounded-xl p-2.5 shadow-2xl w-48 flex flex-col gap-2">
                    <div class="flex items-center justify-between text-[11px] text-slate-300 font-medium">
                        <span>Orientación Norte</span>
                        <button data-map="1" data-angle="0" class="quick-rot-btn text-[10px] text-blue-400 hover:underline font-mono">Reset 0°</button>
                    </div>
                    <input id="bearingSlider1" type="range" min="0" max="359" value="0" class="bearing-slider w-full" />
                    <div class="grid grid-cols-4 gap-1">
                        <button data-map="1" data-delta="-45" class="delta-rot-btn px-1.5 py-1 rounded bg-slate-800 hover:bg-slate-700 text-[10px] font-mono text-slate-200 border border-slate-700">-45°</button>
                        <button data-map="1" data-delta="-15" class="delta-rot-btn px-1.5 py-1 rounded bg-slate-800 hover:bg-slate-700 text-[10px] font-mono text-slate-200 border border-slate-700">-15°</button>
                        <button data-map="1" data-delta="15" class="delta-rot-btn px-1.5 py-1 rounded bg-slate-800 hover:bg-slate-700 text-[10px] font-mono text-slate-200 border border-slate-700">+15°</button>
                        <button data-map="1" data-delta="45" class="delta-rot-btn px-1.5 py-1 rounded bg-slate-800 hover:bg-slate-700 text-[10px] font-mono text-slate-200 border border-slate-700">+45°</button>
                    </div>
                </div>
            </div>

            <!-- Barra inferior compacta: Altitud s.n.m. + Coordenadas del Mapa 1 (Siempre visible en la base) -->
            <div id="uiCoordsOverlay1" class="absolute bottom-2 left-2 z-[500] pointer-events-none flex items-center gap-1.5 bg-slate-900/85 backdrop-blur-md px-2 py-0.5 rounded-md border border-slate-800/90 text-[10px] font-mono text-slate-300 shadow">
                <span class="text-blue-400 font-semibold flex items-center gap-1" title="Altitud del punto central sobre el nivel del mar">
                    <i class="fa-solid fa-mountain text-[9px]"></i>
                    <span id="elevMap1">-- m</span>
                </span>
                <span class="text-slate-600">|</span>
                <span id="coordsMap1" class="text-slate-400">40.3280, -3.7645</span>
                <span id="scaleBadgeMap1" class="hidden md:inline px-1 rounded bg-blue-500/15 text-blue-300 text-[9px]">Mercator ×1.31</span>
            </div>

            <!-- Tarjeta Flotante de Medición Ultra-Compacta - MAPA 1 -->
            <div id="measureCard1" class="hidden absolute bottom-8 left-2 z-[550] bg-slate-900/95 backdrop-blur-xl border border-blue-500/40 rounded-lg px-2 py-1 shadow-xl pointer-events-auto flex items-center gap-2">
                <span class="w-1.5 h-1.5 rounded-full bg-blue-400 shrink-0"></span>
                <span id="distPrimary1" class="font-mono text-xs font-bold text-white">0.0 m</span>
                <span id="measureCount1" class="font-mono text-[9px] text-slate-400">(0)</span>
                <div class="flex items-center gap-1 ml-0.5">
                    <button id="btnUndoMeasure1" title="Deshacer punto" class="px-1.5 py-0.5 rounded bg-slate-800 hover:bg-slate-700 text-slate-300 text-[9px] disabled:opacity-40" disabled>
                        <i class="fa-solid fa-rotate-left"></i>
                    </button>
                    <button id="btnClearMeasure1" title="Borrar medición" class="px-1.5 py-0.5 rounded bg-rose-600/25 hover:bg-rose-600 text-rose-300 hover:text-white text-[9px] transition">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>
            </div>
        </section>

        <!-- ==================== PANEL MAPA 2 ==================== -->
        <section id="panelMap2" class="relative flex-1 w-full h-full transition-all duration-300 overflow-hidden bg-slate-950 map-ui-hidden">
            <div id="map2" class="w-full h-full z-10"></div>

            <!-- Cruz Central Fija (Retícula de Precisión) -->
            <div class="pointer-events-none absolute inset-0 z-[450] flex items-center justify-center">
                <div class="relative w-5 h-5 flex items-center justify-center">
                    <div class="absolute w-full h-[1.5px] bg-emerald-400/90 shadow-[0_0_4px_rgba(0,0,0,0.9)]"></div>
                    <div class="absolute h-full w-[1.5px] bg-emerald-400/90 shadow-[0_0_4px_rgba(0,0,0,0.9)]"></div>
                    <div class="w-1.5 h-1.5 rounded-full border border-white/90 bg-emerald-500/40"></div>
                </div>
            </div>

            <!-- Botón Ocultar/Mostrar Controles (Modo Limpio - Oculto por defecto) -->

    <script>
        /**************************************************************************
         * CONFIGURACIÓN PWA (INSTALABLE EN CHROME A PANTALLA COMPLETA)
         **************************************************************************/
        let deferredInstallPrompt = null;

        (function setupInstallablePWA() {
            const svgIcon = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect width="512" height="512" rx="112" fill="#0A0F1D"/><path d="M128 160l96-48v240l-96 48V160zm128 48l96-48v240l-96 48V208z" fill="#00E5FF"/></svg>`;
            const iconDataUrl = 'data:image/svg+xml,' + encodeURIComponent(svgIcon);

            const manifestObj = {
                name: 'Comparamapas - Visor Dual de Mapas',
                short_name: 'Comparamapas',
                description: 'Comparador dual de Google Maps con escala real, rotación de norte, superposición y medidor de distancia.',
                start_url: window.location.href,
                scope: './',
                display: 'fullscreen',
                display_override: ['fullscreen', 'standalone'],
                orientation: 'any',
                background_color: '#0A0F1D',
                theme_color: '#0A0F1D',
                icons: [
                    { src: iconDataUrl, sizes: '192x192', type: 'image/svg+xml', purpose: 'any maskable' },
                    { src: iconDataUrl, sizes: '512x512', type: 'image/svg+xml', purpose: 'any maskable' }
                ]
            };

            try {
                const manifestBlob = new Blob([JSON.stringify(manifestObj)], { type: 'application/manifest+json' });
                const manifestUrl = URL.createObjectURL(manifestBlob);
                document.getElementById('pwaManifestLink').setAttribute('href', manifestUrl);
            } catch (e) {}

            if ('serviceWorker' in navigator && (window.location.protocol === 'https:' || window.location.hostname === 'localhost')) {
                const swCode = `
                    self.addEventListener('install', (e) => self.skipWaiting());
                    self.addEventListener('activate', (e) => self.clients.claim());
                    self.addEventListener('fetch', (e) => {
                        e.respondWith(fetch(e.request).catch(() => new Response('', { status: 503 })));
                    });
                `;
                try {
                    const swBlob = new Blob([swCode], { type: 'application/javascript' });
                    navigator.serviceWorker.register(URL.createObjectURL(swBlob)).catch(() => {});
                } catch (e) {}
            }
        })();

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredInstallPrompt = e;
            const installBtn = document.getElementById('btnInstallPWA');
            if (installBtn) {
                installBtn.classList.add('animate-pulse', 'bg-cyan-500/30');
            }
        });

        window.addEventListener('appinstalled', () => {
            deferredInstallPrompt = null;
            showToast('Comparamapas instalado correctamente');
            if (document.documentElement.requestFullscreen && !document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(() => {});
            }
        });

        document.getElementById('btnInstallPWA').addEventListener('click', async () => {
            if (deferredInstallPrompt) {
                deferredInstallPrompt.prompt();
                const choice = await deferredInstallPrompt.userChoice;
                if (choice.outcome === 'accepted') {
                    deferredInstallPrompt = null;
                }
            } else {
                if (!document.fullscreenElement && document.documentElement.requestFullscreen) {
                    document.documentElement.requestFullscreen().catch(() => {});
                }
                showToast('En Chrome: Menú (⋮) → "Guardar y compartir" → "Instalar Comparamapas"');
            }
        });

        if (window.matchMedia('(display-mode: standalone)').matches || window.matchMedia('(display-mode: fullscreen)').matches) {
            document.addEventListener('pointerdown', () => {
                if (!document.fullscreenElement && document.documentElement.requestFullscreen) {
                    document.documentElement.requestFullscreen().catch(() => {});
                }
            }, { once: true });
        }

        /**************************************************************************
         * SISTEMA DE TOOLTIPS (HOVER Y PULSACIÓN LARGA EN MÓVIL / TÁCTIL)
         **************************************************************************/
        const customTooltipEl = document.getElementById('customTooltip');
        let tooltipPressTimer = null;

        function showButtonTooltip(targetEl) {
            const text = targetEl.getAttribute('data-tooltip');
            if (!text) return;
            customTooltipEl.textContent = text;
            customTooltipEl.classList.remove('opacity-0');
            customTooltipEl.classList.add('opacity-100');

            const rect = targetEl.getBoundingClientRect();
            const ttRect = customTooltipEl.getBoundingClientRect();
            let left = rect.left + rect.width / 2 - ttRect.width / 2;
            left = Math.max(8, Math.min(window.innerWidth - ttRect.width - 8, left));

            let top = rect.bottom + 8;
            if (top + ttRect.height > window.innerHeight - 8) {
                top = rect.top - ttRect.height - 8;
            }
            customTooltipEl.style.left = `${left}px`;
            customTooltipEl.style.top = `${top}px`;
        }

        function hideButtonTooltip() {
            clearTimeout(tooltipPressTimer);
            customTooltipEl.classList.remove('opacity-100');
            customTooltipEl.classList.add('opacity-0');
        }

        document.querySelectorAll('.has-tooltip').forEach(el => {
            el.addEventListener('mouseenter', () => showButtonTooltip(el));
            el.addEventListener('mouseleave', hideButtonTooltip);
            el.addEventListener('touchstart', () => {
                clearTimeout(tooltipPressTimer);
                tooltipPressTimer = setTimeout(() => showButtonTooltip(el), 420);
            }, { passive: true });
            el.addEventListener('touchend', () => {
                setTimeout(hideButtonTooltip, 1100);
            });
            el.addEventListener('touchcancel', hideButtonTooltip);
        });

        /**************************************************************************
         * CONFIGURACIÓN INICIAL Y ESTADO DE COMPARAMAPAS
         **************************************************************************/
        const INITIAL_CENTER = [40.3280, -3.7645]; // Leganés / Madrid
        const INITIAL_ZOOM = 13.5;

        const isMobileOrPortrait = () => window.innerHeight > window.innerWidth || window.innerWidth < 768;

        const state = {
            baseZoom: INITIAL_ZOOM,
            syncZoom: true,
            syncPan: false,
            syncBearing: false,
            splitDirection: isMobileOrPortrait() ? 'horizontal' : 'vertical',
            cleanMode: { 1: true, 2: true }, // Ocultos por defecto
            isMeasuring: false,
            measurePoints1: [],
            measurePoints2: [],
            overlayActive: false,
            overlaySwapped: false,
            overlayOpacity: 55,
            isProgrammaticMove: false,
            map1LayerType: 'streets',
            map2LayerType: 'hybrid',
            map1Proj: 'mercator',
            map2Proj: 'true_size',
            map1Bearing: 0,
            map2Bearing: 0,
            lastCenter1: { lat: INITIAL_CENTER[0], lng: INITIAL_CENTER[1] },
            lastCenter2: { lat: INITIAL_CENTER[0], lng: INITIAL_CENTER[1] },
            lastSearchResults: { 1: [], 2: [] }
        };

        /**************************************************************************
         * CONSULTA DE ALTITUD SOBRE EL NIVEL DEL MAR (m s.n.m.) EN EL PUNTO CENTRAL
         **************************************************************************/
        const elevationCache = new Map();
        const elevationTimers = { 1: null, 2: null };

        function scheduleElevationFetch(mapNum, lat, lng) {
            clearTimeout(elevationTimers[mapNum]);
            elevationTimers[mapNum] = setTimeout(() => {
                fetchCenterElevation(mapNum, lat, lng);
            }, 320);
        }

        async function fetchCenterElevation(mapNum, lat, lng) {
            const elBadge = document.getElementById(`elevMap${mapNum}`);
            if (!elBadge) return;

            const cacheKey = `${lat.toFixed(4)},${lng.toFixed(4)}`;
            if (elevationCache.has(cacheKey)) {
                elBadge.textContent = `${elevationCache.get(cacheKey)} m`;
                return;
            }

            try {
                const url = `https://api.open-meteo.com/v1/elevation?latitude=${lat.toFixed(5)}&longitude=${lng.toFixed(5)}`;
                const res = await fetch(url);
                if (!res.ok) return;
                const data = await res.json();
                if (data && Array.isArray(data.elevation) && data.elevation.length > 0) {
                    const meters = Math.round(data.elevation[0]);
                    elevationCache.set(cacheKey, meters);
                    elBadge.textContent = `${meters.toLocaleString('es-ES')} m`;
                }
            } catch (e) {
                // Silenciar si no hay conexión temporal
            }
        }

        /**************************************************************************
         * FUNCIONES DE ESCALA REAL, PROYECCIÓN Y CREACIÓN DE MAPAS
         **************************************************************************/
        function computeEffectiveMapZoom(baseZoom, projKey, lat) {
            if (projKey === 'true_size' || projKey === 'gall_peters') {
                const rad = Math.max(-84, Math.min(84, lat)) * Math.PI / 180;
                const cosLat = Math.max(0.12, Math.cos(rad));
                return baseZoom + Math.log2(cosLat);
            }
            return baseZoom;
        }

        function computeBaseZoomFromEffective(effectiveZoom, projKey, lat) {
            if (projKey === 'true_size' || projKey === 'gall_peters') {
                const rad = Math.max(-84, Math.min(84, lat)) * Math.PI / 180;
                const cosLat = Math.max(0.12, Math.cos(rad));
                return effectiveZoom - Math.log2(cosLat);
            }
            return effectiveZoom;
        }

        function applyGallPetersAspectTransform(mapNum) {
            const projKey = mapNum === 1 ? state.map1Proj : state.map2Proj;
            const targetMap = mapNum === 1 ? map1 : map2;
            const mapEl = document.getElementById(`map${mapNum}`);
            if (!mapEl) return;

            if (projKey === 'gall_peters') {
                const lat = targetMap.getCenter().lat;
                const rad = Math.max(-80, Math.min(80, lat)) * Math.PI / 180;
                const scaleY = Math.max(0.45, Math.min(1.35, Math.cos(rad) * 1.15));
                mapEl.style.transform = `scale(1, ${scaleY.toFixed(3)})`;
            } else {
                mapEl.style.transform = 'scale(1, 1)';
            }
        }

        function updateScaleBadges() {
            [1, 2].forEach(num => {
                const m = num === 1 ? map1 : map2;
                const proj = num === 1 ? state.map1Proj : state.map2Proj;
                const badge = document.getElementById(`scaleBadgeMap${num}`);
                if (!badge || !m) return;

                const lat = m.getCenter().lat;
                const rad = Math.max(-84, Math.min(84, lat)) * Math.PI / 180;
                const mercatorExpansion = (1 / Math.max(0.12, Math.cos(rad))).toFixed(2);

                if (proj === 'mercator') {
                    badge.textContent = `Mercator ×${mercatorExpansion}`;
                } else if (proj === 'true_size') {
                    badge.textContent = 'Escala Real (1:1)';
                } else {
                    badge.textContent = 'Gall-Peters (Área Eq.)';
                }
            });
        }

        function createGoogleTileLayer(layerType) {
            const lyrsMap = {
                streets: 'm',
                satellite: 's',
                hybrid: 'y',
                terrain: 'p'
            };
            const lyrCode = lyrsMap[layerType] || 'm';
            return L.tileLayer(`https://mt1.google.com/vt/lyrs=${lyrCode}&x={x}&y={y}&z={z}&hl=es`, {
                maxZoom: 21,
                attribution: '&copy; Google Maps'
            });
        }

        const map1 = L.map('map1', {
            center: INITIAL_CENTER,
            zoom: computeEffectiveMapZoom(INITIAL_ZOOM, state.map1Proj, INITIAL_CENTER[0]),

            rotate: true,
            bearing: 0
        });

        const map2 = L.map('map2', {
            center: INITIAL_CENTER,
            zoom: computeEffectiveMapZoom(INITIAL_ZOOM, state.map2Proj, INITIAL_CENTER[0]),
            zoomSnap: 0,
            zoomDelta: 0.5,
            rotate: true,
            bearing: 0
        });

        L.control.scale({ imperial: false, position: 'bottomright' }).addTo(map1);
        L.control.scale({ imperial: false, position: 'bottomright' }).addTo(map2);

        let activeTileLayer1 = createGoogleTileLayer(state.map1LayerType).addTo(map1);
        let activeTileLayer2 = createGoogleTileLayer(state.map2LayerType).addTo(map2);

        const measureLayerGroup1 = L.layerGroup().addTo(map1);
        const measureLayerGroup2 = L.layerGroup().addTo(map2);

        // Consultar altitud inicial de ambos centros
        fetchCenterElevation(1, INITIAL_CENTER[0], INITIAL_CENTER[1]);
        fetchCenterElevation(2, INITIAL_CENTER[0], INITIAL_CENTER[1]);

        /**************************************************************************
         * MINI MAPAS DE SUPERPOSICIÓN (ARRASTRABLE Y REDIMENSIONABLE)
         **************************************************************************/
        const overlayMap1 = L.map('overlayMap1', {
            center: INITIAL_CENTER,
            zoom: computeEffectiveMapZoom(INITIAL_ZOOM, state.map1Proj, INITIAL_CENTER[0]),
            zoomControl: false,
            attributionControl: false,
            dragging: false,
            scrollWheelZoom: false,
            doubleClickZoom: false,
            boxZoom: false,
            keyboard: false,
            zoomSnap: 0,
            rotate: true,
            bearing: 0
        });

        const overlayMap2 = L.map('overlayMap2', {
            center: INITIAL_CENTER,
            zoom: computeEffectiveMapZoom(INITIAL_ZOOM, state.map2Proj, INITIAL_CENTER[0]),
            zoomControl: false,
            attributionControl: false,
            dragging: false,
            scrollWheelZoom: false,
            doubleClickZoom: false,
            boxZoom: false,
            keyboard: false,
            zoomSnap: 0,

        let overlayTileLayer1 = createGoogleTileLayer(state.map1LayerType).addTo(overlayMap1);

        function syncOverlayMaps() {
            if (!state.overlayActive) return;

            const c1 = map1.getCenter();
            const z1 = map1.getZoom();
            overlayMap1.setView(c1, z1, { animate: false });
            if (typeof overlayMap1.setBearing === 'function') {
                overlayMap1.setBearing(state.map1Bearing);
            }

            const c2 = map2.getCenter();
            const z2 = map2.getZoom();
            overlayMap2.setView(c2, z2, { animate: false });

        function updateOverlayLayerStackAndOpacity() {
            const el1 = document.getElementById('overlayMap1');

        function toggleOverlayWindow(forceState) {

                dot.className = 'absolute top-1 right-1 w-1.5 h-1.5 rounded-full bg-slate-600';
